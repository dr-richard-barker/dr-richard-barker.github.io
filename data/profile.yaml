themes:
  - id: "space-cea"
    name: "Spaceflight Biology & Controlled Environment Ag"
    icon: "🚀"
    description: "Decoding how plants adapt to microgravity, cosmic radiation, and altered gas boundary layers on the International Space Station and future lunar habitats."
    keywords: ["Lunar LEAF", "Microgravity", "Hypoxia", "ROS Signaling", "Boundary Layer Transport", "AstroBotany"]
  - id: "ai-data"
    name: "AI, Foundation Models & Biological Digital Twins"
    icon: "🧠"
    description: "Developing representation learning, foundation model toolkits (NASA-IBM LFM), and FAIR multi-omics discovery engines (TOAST, GLARE, Rad-Bio-App)."
    keywords: ["Representation Learning", "Bioinformatics", "FAIR Data", "NASA OSDR", "Biological Digital Twins"]
  - id: "biomanufacturing"
    name: "Fungal Biomanufacturing & Mycoponics"
    icon: "🍄"
    description: "Engineering solid-state mycelial growth matrices, biophysical nutrient delivery, and circular biomaterials for space exploration and terrestrial sustainability."
    keywords: ["Mycoponics", "Fungal Biomaterials", "Solid-State Fermentation", "Circular Bioeconomy"]
  - id: "phenotyping"
    name: "Open Instrumentation, Robotics & Phenotyping"
    icon: "🔬"
    description: "Pioneering low-cost, open-source automated imaging platforms, robotic seed sowing devices (ABCD, Vacuum Manifold), and computer vision pipelines."
    keywords: ["Computer Vision", "Automated Phenotyping", "Robotics", "Hardware Hack", "Microcontrollers"]
  - id: "outreach"
    name: "Open Science, Mentorship & Public Impact"
    icon: "🌱"
    description: "Transforming science communication through classroom citizen science kits, interactive simulators, high school bioinformatics curricula, and public outreach."
    keywords: ["Mentoring Award 2018", "ASGSR Outreach", "PEOPLE Program", "3000+ Classrooms"]

