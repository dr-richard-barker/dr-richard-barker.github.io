    organization: "Biotechnology and Biological Sciences Research Council, Oxford, UK"
    description: "Selected across UK universities for commercialization concept in agricultural biotechnology."
  - title: "Best Science Communication Student Award"
    year: "2008 – 2009"
    organization: "Rothamsted Research, UK"
    description: "Recognized for translating agricultural hormone biochemistry and genetics to public and student audiences."
  - title: "Lawes Trust Agricultural Scholarship"
    year: "2007 – 2011"
