service:
  - role: "Chair, Plant Analysis Working Group (AWG)"
    organization: "NASA GeneLab / Open Science Data Repository (OSDR)"
    period: "2018 – Present"
    details: "Coordinates 100+ international researchers; hosts monthly scientific seminars; publishes standardized pipelines; organizes annual public workshops at ASGSR and COSPAR."
  - role: "Chair, Education and Outreach Committee"
    organization: "American Society for Gravitational and Space Research (ASGSR)"
    period: "2024 – Present"
    details: "Leads national conference student programs, public outreach initiatives, and social media communications."
  - role: "Federal Peer Reviewer"
    organization: "National Science Foundation (NSF) & NASA"
    period: "2019 – Present"
    details: "NSF Proto-OKN Expert Panel (2023–2024); NASA TOPS & ROSES Open-Source Science (2023); NASA Space Biology ad-hoc reviewer."
  - role: "Journal Peer Reviewer"
    organization: "International Scientific Journals"
    period: "2015 – Present"
    details: "Regular reviewer for Nature Communications, npj Microgravity, Frontiers in Plant Science, Plant Methods, Biotechnology Journal, iScience, Patterns, and International Journal of Molecular Sciences."

teaching_and_mentoring:
  - title: "UW–Madison Undergraduate Mentoring Leadership"
    period: "2012 – 2023"
    institution: "University of Wisconsin–Madison"
    details: "Directly mentored 20+ undergraduate and post-baccalaureate researchers across Botany and Genetics. Mentored students have gone on to doctoral programs, industry careers, and co-authored multiple peer-reviewed papers."
  - title: "AstroBotany Experiential Project-Based Laboratory"
    period: "2017 – 2020"
    institution: "UW–Madison & Sector67"
    details: "Founded and instructed an interdisciplinary lab where undergraduates designed microcontroller plant growth chambers, computer vision algorithms, and plant stress assays."
  - title: "Curriculum Lead & Instructor, NASA GeneLab for High Schools"
    period: "2022 – 2025"
    institution: "NASA Space Biosciences"
    details: "Trained over 500 educators and advanced high school students nationwide in Linux command line, RNA-seq quantification, and FAIR data curation."
  - title: "Pre-College STEM Mentorship (PEOPLE Program)"
    period: "2016 – 2023"
    institution: "University of Wisconsin–Madison"
    details: "Mentored first-generation and underrepresented pre-college scholars in Birge Hall labs and co-developed virtual space biology workshops during COVID-19."
  - title: "University Guest Lecturer"
    period: "2016 – Present"
    institution: "UW–Madison & Purdue University"
    details: "Lectures delivered across Plant Physiology (Botany 500), Plant Development, Molecular Genetics (Genetics 560), and ABE Sensor Systems."
  - title: "Capoeira Instructor & Community Practitioner"
    period: "2004 – Present"
    institution: "UK & Madison, WI"
    details: "Over 20 years teaching Afro-Brazilian Capoeira, fostering inclusive community movement, mutual respect, and student mental and physical wellbeing."

media_and_public_outreach:
  - title: "Big Ten Network 'LiveBIG' Halftime Broadcast Feature"
    year: "2018 – 2019"
    details: "Featured in national broadcast profile 'Wisconsin is putting down roots in space' highlighting Gilroy Lab plant spaceflight experiments."
  - title: "The Biochemist Popular Science Feature"
    year: "2017"
    details: "Authored invited popular science article 'Life in space isn’t easy, even if you’re green' (39(6): 10–13)."
  - title: "UK International Outreach Tour: 'Plant BRICs in Space'"
    year: "2018"
    details: "Organized public lecture and private herbarium tour at the Natural History Museum London, followed by events at University of Nottingham, Rothamsted Research, and University of Cambridge."
  - title: "3,000+ Classrooms Citizen Science Deployment"
    year: "2017 – Present"
    details: "Partnered with Fairchild Tropical Botanic Garden (Growing Beyond Earth) and Magnitude.io (ExoLab) to distribute AstroBotany calibration cards and plant analysis protocols worldwide."
